name: 补充组件线索 / 新包名提议
description: 提供清单尚未覆盖的运营商或厂商遥测组件包名与分析线索
title: "[组件线索]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎补充清单尚未覆盖的运营商或厂商遥测组件！
        若仅分享已有清单组件的机型实测反馈，请前往 [Discussions](https://github.com/Eynnzerr/TelemetryCleaner/discussions)。

  - type: input
    id: vendor
    attributes:
      label: 厂商 / ROM
      placeholder: 例如：三星国行 / One UI、努比亚 / MyOS、OPPO / ColorOS
    validations:
      required: true

  - type: input
    id: carrier_or_type
    attributes:
      label: 运营商或组件类型
      placeholder: 例如：中国电信、中国移动、厂商自带遥测组件
    validations:
      required: true

  - type: input
    id: package_name
    attributes:
      label: 组件包名
      placeholder: 例如：com.example.telemetry（多个包名可用逗号分隔）
    validations:
      required: true

  - type: input
    id: device_env
    attributes:
      label: 发现环境（机型与系统版本）
      placeholder: 例如：Galaxy S24 Ultra / One UI 8.5 / Android 16
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 线索说明与实测情况
      description: 请补充该组件的权限声明、行为分析（反编译/抓包等），以及是否在「设置 → 组件检查清单」自定义添加后实测过卸载或冻结
      placeholder: |
        - 发现依据 / 权限或行为线索：
        - 是否已实测卸载/冻结及重启后表现：
        - 其他补充说明或截图：
    validations:
      required: true
